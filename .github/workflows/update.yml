name: Update NBA data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-data-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test notes import safety
        run: node tests/test_notes_import.js
      - name: Test schedule filters
        run: node tests/test_schedule_filter.js
      - name: Test front-end logic (H2H, preseason, dates, standings)
        run: node tests/test_front_logic.js
      - name: Refresh NBA data
        run: python -u scripts/update_nba.py
      - name: Validate refreshed data before publication
        run: python scripts/validate_data.py
      - name: Commit refreshed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nba.json
          if git diff --cached --quiet; then
            echo "NBA data unchanged; nothing to publish"
            exit 0
          fi
          # Keep the freshly validated data while rebasing onto the latest main.
          cp data/nba.json "${RUNNER_TEMP}/nba-validated.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp "${RUNNER_TEMP}/nba-validated.json" data/nba.json
            git add data/nba.json
            if git diff --cached --quiet; then
              echo "NBA data already published"
              exit 0
            fi
            git commit -m 'Update NBA data'
            if git push origin HEAD:main; then
              echo "NBA data published successfully"
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying against latest main"
            sleep $((attempt * 2))
          done
          echo "Failed to publish after five safe attempts" >&2
          exit 1
