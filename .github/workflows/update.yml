name: Update NBA data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test notes import safety
        run: node tests/test_notes_import.js
      - name: Test schedule filters
        run: node tests/test_schedule_filter.js
      - name: Refresh NBA data
        run: python -u scripts/update_nba.py
      - name: Validate refreshed data before publication
        run: python scripts/validate_data.py
      - name: Commit refreshed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nba.json
          git diff --cached --quiet || (git commit -m 'Update NBA data' && git push)
