<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA | Commentator Center</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17202b;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#111923;color:#fff;padding:18px max(22px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:22px;letter-spacing:-.6px}header b{color:#ffcf43}.badge{font-size:12px;background:#354050;padding:7px 11px;border-radius:30px}.wrap{max-width:1200px;margin:auto;padding:18px 18px 60px}.logos{background:#e9edf1;display:flex;gap:4px;overflow-x:auto;padding:10px;scrollbar-width:thin}.logo{flex:0 0 62px;border:0;background:transparent;border-radius:8px;padding:5px;cursor:pointer}.logo:hover,.logo.selected{background:#fff;box-shadow:0 0 0 2px #f3b844}.logo img{width:49px;height:49px;object-fit:contain}.logo span{display:block;font-size:10px;font-weight:700;color:#39485b}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:17px 0}button,select{font:inherit}button{cursor:pointer;border:1px solid #d8dfe7;background:#fff;padding:10px 14px;border-radius:9px;font-weight:700;color:#263342}button.active,button.primary{background:#192b42;color:#fff;border-color:#192b42}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e8ad00}select{padding:10px;border:1px solid #ccd5df;border-radius:9px;background:#fff;max-width:100%}h1{font-size:27px;margin:6px 0}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:0 0 10px}.muted{color:#657181}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e1e6ec;border-radius:13px;padding:19px;box-shadow:0 2px 8px #152d4410;margin-bottom:16px}.team{display:flex;align-items:center;gap:13px}.team img{width:75px;height:75px;object-fit:contain}.team strong{font-size:19px}.team .muted{font-size:13px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}.kpi{background:#f2f5f8;padding:10px;border-radius:9px;text-align:center}.kpi strong{display:block;font-size:17px}.kpi span{font-size:11px;color:#667587}.center{text-align:center}.h2h{font-size:28px;font-weight:800;color:#172a42}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.pill{font-size:11px;border-radius:6px;padding:4px 7px;display:inline-block;font-weight:800}.win{background:#d4f5e5;color:#0b7542}.loss{background:#fce0e0;color:#a71b29}.results{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.result{padding:8px 10px;font-size:12px;text-decoration:none;border-radius:7px;font-weight:800}.result.win{background:#d4f5e5;color:#0b7542}.result.loss{background:#fce0e0;color:#a71b29}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 8px;border-bottom:1px solid #e9edf2;text-align:left}th{font-size:12px;color:#627184}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}a{color:#185b9b}a:hover{text-decoration:underline}.news-item{padding:12px 0;border-bottom:1px solid #e9edf2}.news-item a{font-weight:700;text-decoration:none}.news-item .small{margin-top:5px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px}textarea{width:100%;min-height:240px;resize:vertical;border:1px solid #ccd5df;border-radius:9px;padding:12px;font:14px/1.6 system-ui}.notice{background:#fff7e6;border:1px solid #f3d596;padding:12px 14px;border-radius:9px;margin:14px 0}.empty{padding:18px;background:#f5f7fa;border-radius:8px;color:#69788a}.table-wrap{overflow:auto}.stack{display:grid;gap:12px}.tag{background:#eef3f7;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}.hide{display:none!important}@media(max-width:700px){header{padding:15px}.grid,.grid3,.notes{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:14px}.team img{width:60px;height:60px}h1{font-size:23px}.kpis{gap:5px}.kpi{padding:8px 3px}}
</style></head><body><header><strong>NBA <b>|</b> COMMENTATOR CENTER</strong><span class="badge" id="fresh">Loading data…</span></header><div class="wrap"><div class="logos" id="logos" aria-label="NBA teams"></div><nav id="nav"><button data-page="matchup" class="active">Párharcelemző</button><button data-page="schedule">Schedule</button><button data-page="standings">Standings</button><button data-page="team">Team & player stats</button></nav><div id="alerts" role="status"></div><main id="app"><div class="card">Loading NBA data…</div></main></div><script src="config.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);
const sharedConfig=window.NBA_SHARED_NOTES||{};
const sharedEnabled=(()=>{try{const u=new URL(sharedConfig.url);return u.protocol==='https:'&&u.hostname.endsWith('.supabase.co')&&typeof sharedConfig.anonKey==='string'&&sharedConfig.anonKey.length>20}catch{return false}})();
const sharedEndpoint=()=>sharedConfig.url.replace(/\/$/,'')+'/rest/v1/nba_commentator_notes';
const sharedHeaders=()=>({'apikey':sharedConfig.anonKey,'Authorization':'Bearer '+sharedConfig.anonKey,'Content-Type':'application/json'});
let notesSaveTimer=null;
async function loadSharedNotes(){
 if(!sharedEnabled)return;
 const key=notesKey();const r=await fetch(sharedEndpoint()+'?matchup_key=eq.'+encodeURIComponent(key)+'&select=notes',{headers:sharedHeaders()});
 if(!r.ok)throw Error('Shared notes read HTTP '+r.status);
 const rows=await r.json();if(!Array.isArray(rows))throw Error('Invalid shared notes response');
 if(rows.length){const value=rows[0].notes; if(!value||typeof value!=='object'||Array.isArray(value))throw Error('Invalid shared notes');localStorage.setItem(key,JSON.stringify(value));}
}
async function saveSharedNotes(key,value){
 if(!sharedEnabled)return;
 const r=await fetch(sharedEndpoint()+'?on_conflict=matchup_key',{method:'POST',headers:{...sharedHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({matchup_key:key,notes:value})});
 if(!r.ok)throw Error('Shared notes write HTTP '+r.status);
}
async function refreshSharedNotes(){
 if(!sharedEnabled)return;
 const key=notesKey();const status=$('note-status');if(status)status.textContent='Loading shared notes…';
 try{await loadSharedNotes();if(key===notesKey()){render();const next=$('note-status');if(next)next.textContent='Shared notes loaded · public workspace';}}
 catch(e){const next=$('note-status');if(next)next.textContent='Shared notes unavailable; local notes retained: '+e.message;}
}
const safeUrl=value=>{try{const u=new URL(String(value));return u.protocol==='https:'||u.protocol==='http:'?u.href:'#'}catch{return '#'}};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={data:null,page:'matchup',home:'',away:'',team:'',split:'all',season:'all',notes:{},details:{},error:'',scheduleTeam:'all',scheduleStatus:'all'};
const team=id=>state.data?.teams.find(t=>t.id===String(id));
const allGames=()=>state.data?.games||[];const complete=g=>g.completed&&g.home.score!==null&&g.away.score!==null;
const seasonGames=()=>allGames().filter(g=>String(g.date||'').slice(0,10)>=(state.data?.seasonStart||'0000-01-01'));
const teamGames=id=>seasonGames().filter(g=>complete(g)&&(g.home.id===id||g.away.id===id)).sort((a,b)=>b.date.localeCompare(a.date));
const isHome=(g,id)=>g.home.id===id;const won=(g,id)=>(isHome(g,id)?g.home.score>g.away.score:g.away.score>g.home.score);
const rec=games=>({w:games.filter(g=>won(g,g._team)).length,l:games.filter(g=>!won(g,g._team)).length});
const record=(games,id)=>`${games.filter(g=>won(g,id)).length}–${games.filter(g=>!won(g,id)).length}`;
const date=s=>{const d=new Date(s);return Number.isNaN(d.valueOf())?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})};
const logo=t=>t?.logo?`<img src="${escapeHTML(t.logo)}" alt="${escapeHTML(t.name)} logo" loading="lazy">`:'';
const gameLink=g=>`https://www.espn.com/nba/game/_/gameId/${encodeURIComponent(g.id)}`;
const statusLine=g=>`${date(g.date)} · ${escapeHTML(g.away.abbr)} ${g.away.score??'–'} – ${g.home.score??'–'} ${escapeHTML(g.home.abbr)}`;
const stats=id=>state.data?.standings?.[id]||{};
const stat=(id,...keys)=>{const s=stats(id).stats||{};for(const k of keys)if(s[k]!==undefined)return s[k];return '—'};
const teamCard=id=>{const t=team(id);if(!t)return '<div class="card empty">Select a team</div>';const g=teamGames(id),home=g.filter(x=>isHome(x,id)),away=g.filter(x=>!isHome(x,id));const s=stats(id);return `<section class="card"><div class="team">${logo(t)}<div><strong>${escapeHTML(t.name)}</strong><div class="muted">${escapeHTML(s.conference||'Conference unavailable')} · ${escapeHTML(s.division||'Division unavailable')}</div></div></div><div class="kpis"><div class="kpi"><strong>${escapeHTML(stat(id,'conferenceRank','playoffSeed','seed'))}</strong><span>Conference rank</span></div><div class="kpi"><strong>${escapeHTML(stat(id,'divisionRank','divisionStanding'))}</strong><span>Division rank</span></div><div class="kpi"><strong>${escapeHTML(stat(id,'overall','wins'))}</strong><span>Official standing</span></div><div class="kpi"><strong>${record(g,id)}</strong><span>Collected season W–L</span></div><div class="kpi"><strong>${record(home,id)}</strong><span>Home (collected)</span></div><div class="kpi"><strong>${record(away,id)}</strong><span>Away (collected)</span></div></div></section>`};
function renderLogos(){ $('logos').innerHTML=state.data.teams.map(t=>`<button class="logo ${state.team===t.id?'selected':''}" data-team="${escapeHTML(t.id)}" title="${escapeHTML(t.name)}">${logo(t)}<span>${escapeHTML(t.abbr)}</span></button>`).join('');}
function selectTeam(id){state.team=id;state.page='team';render();}
function selector(id,value){return `<select id="${id}" aria-label="${id}">${state.data.teams.map(t=>`<option value="${escapeHTML(t.id)}" ${t.id===value?'selected':''}>${escapeHTML(t.name)}</option>`).join('')}</select>`}
function form(id){const games=teamGames(id).filter(g=>state.split==='all'||(state.split==='home'===isHome(g,id))).slice(0,10);return `<div class="card"><h3>${escapeHTML(team(id)?.name||'')}</h3><div class="muted small">${games.length} completed games in selected split · W–L ${record(games,id)}</div><div class="results">${games.length?games.map(g=>`<a class="result ${won(g,id)?'win':'loss'}" target="_blank" rel="noopener" title="${escapeHTML(statusLine(g))}" href="${gameLink(g)}">${won(g,id)?'W':'L'} ${isHome(g,id)?g.home.score:g.away.score}–${isHome(g,id)?g.away.score:g.home.score}</a>`).join(''):'<span class="muted">No games available</span>'}</div><div class="small muted">Click any result for the ESPN game page. ${games.length<10?'Fewer than 10 games available in the selected split.':''}</div></div>`}
function h2hRecord(games,seasonType){const selected=games.filter(g=>String(g.seasonType)===seasonType);return `${selected.filter(g=>won(g,state.home)).length}–${selected.filter(g=>won(g,state.away)).length}`;}
function h2hGames(){return (state.data.history||allGames()).filter(g=>complete(g)&&[g.home.id,g.away.id].includes(state.home)&&[g.home.id,g.away.id].includes(state.away)).sort((a,b)=>b.date.localeCompare(a.date))}
function matchups(){const games=h2hGames();return `<section class="card center"><h2>Head to head — collected history</h2><div class="h2h">${games.filter(g=>won(g,state.home)).length} – ${games.filter(g=>won(g,state.away)).length}</div><p class="muted small">Regular season: ${h2hRecord(games,"2")} · Playoffs: ${h2hRecord(games,"3")} · Unclassified: ${games.filter(g=>!["2","3"].includes(String(g.seasonType))).length} games</p><p class="muted small">Historical results from the downloaded seasons; not necessarily all-time. Coverage: ${escapeHTML(state.data.historyStart||"recent games")} onward. ${state.data.historyComplete===false?"Warning: some months are missing.":""}</p></section><section class="card"><h2>Previous meetings</h2>${games.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Game</th><th>Winner</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${date(g.date)}</td><td>${escapeHTML(g.away.abbr)} ${g.away.score} – ${g.home.score} ${escapeHTML(g.home.abbr)}</td><td>${escapeHTML(team(won(g,g.home.id)?g.home.id:g.away.id)?.name||'')}</td><td><a href="${gameLink(g)}" target="_blank" rel="noopener">Box score</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No previous meetings in the collected data window.</div>'}</section>`}
function newsPanel(){const names=[team(state.home),team(state.away)].filter(Boolean).flatMap(t=>[t.name,t.abbr,t.name.split(' ').slice(-1)[0]]).map(x=>x.toLowerCase());const items=(state.data.news||[]).filter(a=>a.teamIds?.includes(state.home)||a.teamIds?.includes(state.away)||names.some(n=>n.length>3&&(a.title+' '+a.description).toLowerCase().includes(n))); return `<section class="card"><h2>News & storylines</h2><p class="muted small">Articles matched to either team by source tags or team names. ESPN and NBA.com feeds where available; official team sites require verified source integrations.</p>${items.length?items.slice(0,35).map(a=>`<article class="news-item"><a href="${escapeHTML(safeUrl(a.url))}" target="_blank" rel="noopener">${escapeHTML(a.title)}</a><div class="small muted">${escapeHTML(a.source)} · ${date(a.published)}</div><div class="small">${escapeHTML(a.description)}</div></article>`).join(''):'<div class="empty">No team-tagged ESPN articles returned. No stories have been invented.</div>'}</section>`}
function notesKey(){return `nba-notes:${[state.home,state.away].sort().join(":")}`}
function notesPanel(){let value={};try{value=JSON.parse(localStorage.getItem(notesKey())||'{}')}catch{}return `<section class="card"><h2>Commentator notes</h2><p class="small muted">${sharedEnabled?'Public shared notes enabled: anyone with site access can read and change them. Do not store confidential information.':'Saved in this browser. Export/import to transfer notes; configure Supabase to enable public shared notes.'}</p><div class="notes"><div><h3>${escapeHTML(team(state.home)?.name||'Home')}</h3><textarea data-note="home" placeholder="• Key talking points">${escapeHTML(value[state.home]||value.home||'')}</textarea></div><div><h3>${escapeHTML(team(state.away)?.name||'Away')}</h3><textarea data-note="away" placeholder="• Key talking points">${escapeHTML(value[state.away]||value.away||'')}</textarea></div></div><div class="toolbar">${sharedEnabled?'<button type="button" id="reload-notes">Reload shared notes</button>':''}<button type="button" id="export-notes">Export notes (JSON)</button><button type="button" id="import-notes">Import notes (JSON)</button><input type="file" id="notes-file" accept="application/json,.json" class="hide" aria-label="Import commentator notes"></div><div class="small muted" id="note-status">Autosaves as you type</div></section>`}
function comparisonPanel(){const keys=[['pointsFor','Points scored'],['pointsAgainst','Points conceded'],['avgPointsFor','Points per game'],['avgPointsAgainst','Points allowed / game'],['pointDifferential','Point differential'],['winPercent','Win percentage'],['streak','Current streak']];const rows=keys.map(([key,label])=>{const a=stat(state.home,key),b=stat(state.away,key);return `<tr><td class="num">${escapeHTML(a)}</td><td class="center">${escapeHTML(label)}</td><td class="num">${escapeHTML(b)}</td></tr>`});return `<section class="card"><h2>Statistical comparison</h2><p class="small muted">Only verified fields present in ESPN standings are shown. Advanced pace and efficiency metrics require a separate validated feed.</p><div class="table-wrap"><table><thead><tr><th class="num">${escapeHTML(team(state.home)?.abbr)}</th><th class="center">Metric</th><th class="num">${escapeHTML(team(state.away)?.abbr)}</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>`}
function matchup(){const games=h2hGames();return `<div class="toolbar"><strong>Matchup</strong>${selector('home-select',state.home)}<span>vs</span>${selector('away-select',state.away)}</div><div class="grid">${teamCard(state.home)}${teamCard(state.away)}</div><section class="card center"><h2>Head to head — collected history</h2><div class="h2h">${games.filter(g=>won(g,state.home)).length} – ${games.filter(g=>won(g,state.away)).length}</div><p class="muted small">Regular season: ${h2hRecord(games,"2")} · Playoffs: ${h2hRecord(games,"3")} · Unclassified: ${games.filter(g=>!["2","3"].includes(String(g.seasonType))).length} games</p><p class="muted small">Historical results from the downloaded seasons; not necessarily all-time. Coverage: ${escapeHTML(state.data.historyStart||"recent games")} onward. ${state.data.historyComplete===false?"Warning: some months are missing.":""}</p></section><section class="card"><h2>Form & records — last 10</h2>${state.data.seasonComplete===false?'<div class="notice">Current-season collection is incomplete; form and home/away records may omit games.</div>':''}<div class="toolbar"><label for="split-select">Location</label><select id="split-select"><option value="all" ${state.split==='all'?'selected':''}>All games</option><option value="home" ${state.split==='home'?'selected':''}>Home only</option><option value="away" ${state.split==='away'?'selected':''}>Away only</option></select></div><div class="grid">${form(state.home)}${form(state.away)}</div></section>${notesPanel()}<section class="card"><h2>Previous meetings</h2>${games.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Game</th><th>Winner</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${date(g.date)}</td><td>${escapeHTML(g.away.abbr)} ${g.away.score} – ${g.home.score} ${escapeHTML(g.home.abbr)}</td><td>${escapeHTML(team(won(g,g.home.id)?g.home.id:g.away.id)?.name||'')}</td><td><a href="${gameLink(g)}" target="_blank" rel="noopener">Box score</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No previous meetings in the collected data window.</div>'}</section>${comparisonPanel()}${newsPanel()}`}

function filterScheduleGames(games,teamId,status){return games.filter(g=>(teamId==='all'||g.home.id===teamId||g.away.id===teamId)&&(status==='all'||(status==='completed'?complete(g):status==='upcoming'?!complete(g):false))).sort((a,b)=>a.date.localeCompare(b.date))}
function schedule(){const games=filterScheduleGames(allGames(),state.scheduleTeam,state.scheduleStatus);const teams=state.data.teams;return `<h1>NBA Schedule & results</h1><section class="card"><div class="toolbar"><label for="schedule-team">Team</label><select id="schedule-team"><option value="all">All 30 teams</option>${teams.map(t=>`<option value="${escapeHTML(t.id)}" ${state.scheduleTeam===t.id?'selected':''}>${escapeHTML(t.name)}</option>`).join('')}</select><label for="schedule-status">Games</label><select id="schedule-status"><option value="all" ${state.scheduleStatus==='all'?'selected':''}>All</option><option value="completed" ${state.scheduleStatus==='completed'?'selected':''}>Final</option><option value="upcoming" ${state.scheduleStatus==='upcoming'?'selected':''}>Upcoming / live</option></select><span class="muted small">${games.length} games</span></div>${games.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Matchup</th><th>Status</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${date(g.date)}</td><td>${escapeHTML(g.away.name)} ${g.away.score??''} @ ${escapeHTML(g.home.name)} ${g.home.score??''}</td><td>${escapeHTML(g.detail||g.status)}</td><td><a href="${gameLink(g)}" target="_blank" rel="noopener">Game</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No games match the selected filters.</div>'}</section>`}

function standingsPage(){const ts=state.data.teams;return `<h1>NBA Standings</h1><p class="muted">Official standings fields, when available. Missing fields are shown as unavailable.</p><section class="card"><div class="table-wrap"><table><thead><tr><th>Team</th><th>Conference</th><th>Division</th><th class="num">Conf rank</th><th class="num">Div rank</th><th class="num">Record</th></tr></thead><tbody>${ts.map(t=>`<tr><td><button data-team="${t.id}">${escapeHTML(t.name)}</button></td><td>${escapeHTML(stats(t.id).conference||'—')}</td><td>${escapeHTML(stats(t.id).division||'—')}</td><td class="num">${escapeHTML(stat(t.id,'conferenceRank','playoffSeed','seed'))}</td><td class="num">${escapeHTML(stat(t.id,'divisionRank','divisionStanding'))}</td><td class="num">${escapeHTML(stat(t.id,'overall'))}</td></tr>`).join('')}</tbody></table></div></section>`}
async function playerBox(gameId){if(state.details[gameId])return state.details[gameId];if(state.data?.boxscores?.[gameId])return state.details[gameId]=state.data.boxscores[gameId];const url=`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${encodeURIComponent(gameId)}`;const r=await fetch(url);if(!r.ok)throw Error('Box score fetch failed');const raw=await r.json();const out=[];for(const block of raw.boxscore?.players||[]){const club=block.team?.displayName||'';for(const group of block.statistics||[]){for(const a of group.athletes||[]){out.push({team:club,id:String(a.athlete?.id||''),name:a.athlete?.displayName||'',stats:a.stats||[],labels:group.labels||[]})}}}return state.details[gameId]=out}
function teamPage(){const t=team(state.team);if(!t)return '<div class="empty">Select a team.</div>';const games=teamGames(t.id).slice(0,10);const players=state.data.rosters?.[t.id]||[];const playerStats=state.data.playerStats?.[t.id]||{};const roster=`<section class="card"><h2>Current roster · ${escapeHTML(t.name)}</h2><p class="small muted">Click a player for their ESPN profile and season statistics. Roster data is refreshed by the collector. *Per-game averages from cached current-season box scores only, not full-season official averages; unavailable values shown as —.</p>${players.length?`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Player</th><th>Position</th><th>Age</th><th>Height</th><th>PTS*</th><th>REB*</th><th>AST*</th></tr></thead><tbody>${players.map(p=>`<tr><td>${escapeHTML(p.number||'—')}</td><td><a href="https://www.espn.com/nba/player/_/id/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${escapeHTML(p.name)}</a></td><td>${escapeHTML(p.position||'—')}</td><td>${escapeHTML(p.age??'—')}</td><td>${escapeHTML(p.height||'—')}</td><td>${escapeHTML(playerStats[p.id]?.pts??'—')}</td><td>${escapeHTML(playerStats[p.id]?.reb??'—')}</td><td>${escapeHTML(playerStats[p.id]?.ast??'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Roster unavailable from the current data collection. No player information has been invented.</div>'}</section>`;return `<h1>${escapeHTML(t.name)}</h1>${teamCard(t.id)}${roster}<section class="card"><h2>Recent games & player box scores</h2><p class="muted small">Choose a game to load player box scores. Recent games are cached during data refresh; older games may require ESPN access. Player names link to ESPN profiles.</p>${games.map(g=>`<div class="news-item"><button data-box="${g.id}">${escapeHTML(statusLine(g))} · View players</button><div id="box-${g.id}"></div></div>`).join('')||'<div class="empty">No completed games available.</div>'}</section>`}
function render(){if(!state.data)return;renderLogos();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('app').innerHTML=({matchup,schedule,standings:standingsPage,team:teamPage}[state.page]||matchup)();}
function showError(msg){$('alerts').innerHTML=`<div class="notice">${escapeHTML(msg)}</div>`}
function exportNotes(){const items={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith('nba-notes:')){try{const value=JSON.parse(localStorage.getItem(key));if(value&&typeof value==='object'&&!Array.isArray(value))items[key]=value}catch{}}}const blob=new Blob([JSON.stringify({format:'nba-commentator-notes-v1',notes:items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='nba-commentator-notes.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validateNotesImport(raw){if(!raw||raw.format!=='nba-commentator-notes-v1'||!raw.notes||typeof raw.notes!=='object'||Array.isArray(raw.notes))throw Error('Not a valid NBA commentator notes export');const entries=Object.entries(raw.notes);if(entries.length>500)throw Error('Too many note entries');for(const [key,value] of entries){if(!/^nba-notes:[0-9]+:[0-9]+$/.test(key)||!value||typeof value!=='object'||Array.isArray(value))throw Error('Invalid matchup note');for(const [id,note] of Object.entries(value))if(!/^\d+$/.test(id)||typeof note!=='string'||note.length>100000)throw Error('Invalid note text')}return entries}
document.addEventListener('click',async e=>{if(e.target.closest('#reload-notes')){await refreshSharedNotes();return}if(e.target.closest('#export-notes')){try{exportNotes()}catch(err){$('note-status').textContent='Export failed: '+err.message}return}if(e.target.closest('#import-notes')){$('notes-file').click();return}const logoBtn=e.target.closest('[data-team]');if(logoBtn){selectTeam(logoBtn.dataset.team);return}const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();if(state.page==='matchup')refreshSharedNotes();return}const box=e.target.closest('[data-box]');if(box){const id=box.dataset.box,el=$('box-'+id);el.innerHTML='<div class="small muted">Loading players…</div>';try{const players=await playerBox(id);el.innerHTML=players.length?`<div class="table-wrap"><table><thead><tr><th>Team</th><th>Player</th><th>Game stats</th></tr></thead><tbody>${players.map(p=>`<tr><td>${escapeHTML(p.team)}</td><td><a target="_blank" rel="noopener" href="https://www.espn.com/nba/player/_/id/${encodeURIComponent(p.id)}">${escapeHTML(p.name)}</a></td><td>${escapeHTML(p.stats.join(' | '))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Player box score not available.</div>'}catch(err){el.innerHTML='<div class="notice">Could not load player statistics. ESPN may be unavailable or blocking browser requests.</div>'}}});
document.addEventListener('change',e=>{if(e.target.id==='home-select')state.home=e.target.value;if(e.target.id==='away-select')state.away=e.target.value;if(e.target.id==='split-select')state.split=e.target.value;if(e.target.id==='schedule-team')state.scheduleTeam=e.target.value;if(e.target.id==='schedule-status')state.scheduleStatus=e.target.value;if(['home-select','away-select','split-select','schedule-team','schedule-status'].includes(e.target.id)){if(state.home===state.away){state.away=state.data.teams.find(t=>t.id!==state.home)?.id||''}render();if(['home-select','away-select'].includes(e.target.id))refreshSharedNotes()}});
document.addEventListener('change',async e=>{if(e.target.id!=='notes-file')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error('File exceeds 2 MB');const entries=validateNotesImport(JSON.parse(await file.text()));if(!confirm(`Import ${entries.length} matchup note sets? Existing notes for those matchups will be overwritten.`))return;for(const [key,value] of entries)localStorage.setItem(key,JSON.stringify(value));render();$('note-status').textContent=`Imported ${entries.length} matchup note sets`}catch(err){$('note-status').textContent='Import failed: '+err.message}finally{e.target.value=''}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-note]'))return;const key=notesKey();let obj={};try{obj=JSON.parse(localStorage.getItem(key)||'{}')}catch{}obj[e.target.dataset.note==='home'?state.home:state.away]=e.target.value;try{localStorage.setItem(key,JSON.stringify(obj));$('note-status').textContent=sharedEnabled?'Saved locally · syncing…':'Saved in this browser';if(sharedEnabled){clearTimeout(notesSaveTimer);notesSaveTimer=setTimeout(async()=>{try{await saveSharedNotes(key,obj);if(key===notesKey()&&$('note-status'))$('note-status').textContent='Saved locally and shared'}catch(err){if(key===notesKey()&&$('note-status'))$('note-status').textContent='Saved locally; shared sync failed: '+err.message}},750)}}catch{$('note-status').textContent='Save failed: browser storage unavailable'}});
async function init(){try{const r=await fetch('data/nba.json?ts='+Date.now());if(!r.ok)throw Error('NBA data file missing');const d=await r.json();if(!Array.isArray(d.teams)||d.teams.length<28||!Array.isArray(d.games))throw Error('Incomplete NBA data');state.data=d;state.home=d.teams.find(t=>t.abbr==='NY')?.id||d.teams[0].id;state.away=d.teams.find(t=>t.abbr==='MIN')?.id||d.teams[1].id;state.team=state.home;$('fresh').textContent='Updated '+date(d.generatedAt);if(d.warnings?.length)showError('Partial data: '+d.warnings.join('; '));render();refreshSharedNotes()}catch(err){$('fresh').textContent='Data unavailable';showError('The NBA data pipeline has not successfully populated this site: '+err.message);$('app').innerHTML='<section class="card"><h2>Setup required</h2><p>Run <code>python scripts/update_nba.py</code> in an environment with network access, or trigger the GitHub Actions update workflow. The dashboard will not invent data when its feed is missing.</p></section>'}}
init();
</script></body></html>
