peat(3,minmax(0,1fr));gap:9px;margin-top:14px}.kpi{background:#f2f5f8;padding:10px;border-radius:9px;text-align:center}.kpi strong{display:block;font-size:17px}.kpi span{font-size:11px;color:#667587}.center{text-align:center}.h2h{font-size:28px;font-weight:800;color:#172a42}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.pill{font-size:11px;border-radius:6px;padding:4px 7px;display:inline-block;font-weight:800}.win{background:#d4f5e5;color:#0b7542}.loss{background:#fce0e0;color:#a71b29}.results{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.result{padding:8px 10px;font-size:12px;text-decoration:none;border-radius:7px;font-weight:800}.result.win{background:#d4f5e5;color:#0b7542}.result.loss{background:#fce0e0;color:#a71b29}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 8px;border-bottom:1px solid #e9edf2;text-align:left}th{font-size:12px;color:#627184}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}a{color:#185b9b}a:hover{text-decoration:underline}.news-item{padding:12px 0;border-bottom:1px solid #e9edf2}.news-item a{font-weight:700;text-decoration:none}.news-item .small{margin-top:5px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px}textarea{width:100%;min-height:240px;resize:vertical;border:1px solid #ccd5df;border-radius:9px;padding:12px;font:14px/1.6 system-ui}.notice{background:#fff7e6;border:1px solid #f3d596;padding:12px 14px;border-radius:9px;margin:14px 0}.empty{padding:18px;background:#f5f7fa;border-radius:8px;color:#69788a}.table-wrap{overflow:auto}.stack{display:grid;gap:12px}.tag{background:#eef3f7;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}.hide{display:none!important}@media(max-width:700px){header{padding:15px}.grid,.grid3,.notes{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:14px}.team img{width:60px;height:60px}h1{font-size:23px}.kpis{gap:5px}.kpi{padding:8px 3px}}
.pill.warn{background:#fff1cc;color:#8a5a00}td.best{font-weight:800;color:#0b7542}th.center{background:#f2f5f8}.data-notes{font-size:12px;color:#657181;margin:4px 0 10px}.data-notes summary{cursor:pointer}.data-notes ul{margin:6px 0 0;padding-left:18px}</style></head><body><header><strong>NBA <b>|</b> COMMENTATOR CENTER</strong><span class="badge" id="fresh">Loading data…</span></header><div class="wrap"><div class="logos" id="logos" aria-label="NBA teams"></div><nav id="nav"><button data-page="matchup" class="active">Matchup analysis</button><button data-page="schedule">Schedule</button><button data-page="standings">Standings</button><button data-page="team">Team & player stats</button></nav><div id="alerts" role="status"></div><main id="app"><div class="card">Loading NBA data…</div></main></div><script src="config.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);
const sharedConfig=window.NBA_SHARED_NOTES||{};
const sharedEnabled=(()=>{try{const u=new URL(sharedConfig.url);return u.protocol==='https:'&&u.hostname.endsWith('.supabase.co')&&typeof sharedConfig.anonKey==='string'&&sharedConfig.anonKey.length>20}catch{return false}})();
const sharedEndpoint=()=>sharedConfig.url.replace(/\/$/,'')+'/rest/v1/nba_commentator_notes';
const sharedHeaders=()=>({'apikey':sharedConfig.anonKey,'Authorization':'Bearer '+sharedConfig.anonKey,'Content-Type':'application/json'});
let notesSaveTimer=null;
async function loadSharedNotes(){
 if(!sharedEnabled)return;
 const key=notesKey();const r=await fetch(sharedEndpoint()+'?matchup_key=eq.'+encodeURIComponent(key)+'&select=notes',{headers:sharedHeaders()});
 if(!r.ok)throw Error('Shared notes read HTTP '+r.status);
 const rows=await r.json();if(!Array.isArray(rows))throw Error('Invalid shared notes response');
 if(rows.length){const value=rows[0].notes; if(!value||typeof value!=='object'||Array.isArray(value))throw Error('Invalid shared notes');localStorage.setItem(key,JSON.stringify(value));}
}
async function saveSharedNotes(key,value){
 if(!sharedEnabled)return;
 const r=await fetch(sharedEndpoint()+'?on_conflict=matchup_key',{method:'POST',headers:{...sharedHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({matchup_key:key,notes:value})});
 if(!r.ok)throw Error('Shared notes write HTTP '+r.status);
}
async function refreshSharedNotes(){
 if(!sharedEnabled)return;
 const key=notesKey();const status=$('note-status');if(status)status.textContent='Loading shared notes…';
 try{await loadSharedNotes();if(key===notesKey()){render();const next=$('note-status');if(next)next.textContent='Shared notes loaded · public workspace';}}
 catch(e){const next=$('note-status');if(next)next.textContent='Shared notes unavailable; local notes retained: '+e.message;}
}
const safeUrl=value=>{try{const u=new URL(String(value));return u.protocol==='https:'||u.protocol==='http:'?u.href:'#'}catch{return '#'}};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={data:null,page:'matchup',home:'',away:'',team:'',split:'all',season:'all',notes:{},details:{},error:'',scheduleTeam:'all',scheduleStatus:'all'};
const team=id=>state.data?.teams.find(t=>t.id===String(id));
/*LOGIC-START*/
const SEASON_TYPE={PRE:'1',REGULAR:'2',POST:'3',PLAYIN:'5'};
const seasonTypeLabel=t=>({'1':'Preseason','2':'Regular season','3':'Playoffs','5':'Play-in'}[String(t)]||'Unclassified');
/* Unplayed games have no score; older snapshots stored ESPN's placeholder 0. */
const scoreOf=(g,side)=>g.status==='STATUS_SCHEDULED'||g[side]?.score==null?'':g[side].score;
const complete=g=>!!g&&!!g.completed&&g.home?.score!=null&&g.away?.score!=null;
const isPreseason=g=>String(g.seasonType)===SEASON_TYPE.PRE;
const isHome=(g,id)=>g.home.id===id;
const involves=(g,id)=>g.home.id===id||g.away.id===id;
const won=(g,id)=>isHome(g,id)?g.home.score>g.away.score:g.away.score>g.home.score;
const record=(games,id)=>`${games.filter(g=>won(g,id)).length}–${games.filter(g=>!won(g,id)).length}`;
/* Merge game lists by id; later lists win, so fresh current-season rows override cached history. */
function mergeGames(...lists){const m=new Map();for(const l of lists)for(const g of Array.isArray(l)?l:[])if(g&&g.id!=null)m.set(String(g.id),g);return [...m.values()]}
/* Completed current-season games for form: regular season, play-in and playoffs; never preseason. */
function formGames(games,id,seasonStart){return games.filter(g=>complete(g)&&!isPreseason(g)&&involves(g,id)&&String(g.date||'').slice(0,10)>=seasonStart).sort((a,b)=>b.date.localeCompare(a.date))}
/* Regular-season games only: the basis of an official W-L record. */
function regularGames(games,id,seasonStart){return formGames(games,id,seasonStart).filter(g=>String(g.seasonType)===SEASON_TYPE.REGULAR)}
/* Head to head always merges stored history with the current season; an empty history must never hide current meetings. */
function h2hFrom(history,games,a,b){return a===b?[]:mergeGames(history,games).filter(g=>complete(g)&&!isPreseason(g)&&involves(g,a)&&involves(g,b)).sort((x,y)=>y.date.localeCompare(x.date))}
function h2hSplit(games,a,b){const mk=()=>({a:0,b:0,n:0});const out={total:mk(),byType:{'2':mk(),'3':mk(),'5':mk(),other:mk()}};for(const g of games){const k=['2','3','5'].includes(String(g.seasonType))?String(g.seasonType):'other';const w=won(g,a)?'a':'b';out.total[w]++;out.total.n++;out.byType[k][w]++;out.byType[k].n++}return out}
function historyCoverage(d){const have=Array.isArray(d?.historyDaysFetched)?d.historyDaysFetched.length:0;return {complete:d?.historyComplete===true,have,total:Number(d?.historyTotalDays)||0,start:d?.historyStart||''}}
/* History is stored compactly (ids + scores); restore names/abbreviations from the team list. */
function hydrateGame(g,byId){const side=s=>{const t=byId.get(String(s.id))||{};return {...s,id:String(s.id),name:s.name||t.name||'',abbr:s.abbr||t.abbr||'',logo:s.logo||t.logo||''}};return {...g,completed:g.completed??true,home:side(g.home),away:side(g.away)}}
function hydrateHistory(history,teams){const byId=new Map((teams||[]).map(t=>[String(t.id),t]));return (Array.isArray(history)?history:[]).filter(g=>g&&g.home&&g.away).map(g=>hydrateGame(g,byId))}
/* All times are displayed in US Eastern (NBA schedule) with Central European time for tip-off. */
const ET='America/New_York',CET='Europe/Budapest';
const fmtDate=(opts,tz,loc='en-US')=>s=>{const d=new Date(s);return Number.isNaN(d.valueOf())?'':new Intl.DateTimeFormat(loc,{...opts,timeZone:tz}).format(d)};
const date=fmtDate({month:'short',day:'numeric',year:'numeric'},ET);
const dateTime=fmtDate({month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'},ET);
const tipoffET=fmtDate({hour:'numeric',minute:'2-digit',timeZoneName:'short'},ET);
const tipoffCET=fmtDate({weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZoneName:'short'},CET,'en-GB');
const tipoff=s=>{const a=tipoffET(s),b=tipoffCET(s);return a&&b?`${a} · ${b}`:''};
/* Official standings fields. ESPN no longer sends an "overall" record, so derive it from wins/losses. */
const dashRecord=v=>String(v).replace(/\s*[-–]\s*/,'–');
function officialRecord(s){s=s||{};const o=s.overall||s.record;if(o)return dashRecord(o);if(s.wins!=null&&s.wins!==''&&s.losses!=null&&s.losses!=='')return `${s.wins}–${s.losses}`;return null}
/* playoffSeed is ESPN's tiebreaker-aware seed; the collector's own conferenceRank is only a fallback. */
function confSeed(s){s=s||{};return s.playoffSeed||s.conferenceRank||s.seed||null}
const splitStat=(s,key)=>{const v=(s||{})[key];return v==null||v===''?null:dashRecord(v)};
function standingsByConference(teams,standings){const groups=new Map();for(const t of teams||[]){const info=standings?.[t.id]||{};const conf=info.conference||'Unassigned';if(!groups.has(conf))groups.set(conf,[]);const raw=confSeed(info.stats),n=raw==null||raw===''?NaN:Number(raw);groups.get(conf).push({team:t,info,seed:Number.isFinite(n)?n:null})}
 return [...groups.entries()].sort(([a],[b])=>a.localeCompare(b)).map(([conference,rows])=>({conference,rows:rows.sort((x,y)=>(x.seed??999)-(y.seed??999)||x.team.name.localeCompare(y.team.name))}))}
/* Injury report: most severe first; stale or missing reports are surfaced, never hidden. */
const INJURY_ORDER={'Out':0,'Doubtful':1,'Questionable':2,'Day-To-Day':3};
const injuryClass=s=>s==='Out'?'loss':'warn';
function teamInjuries(data,teamId){return (data?.injuries?.[teamId]||[]).slice().sort((a,b)=>(INJURY_ORDER[a.status]??9)-(INJURY_ORDER[b.status]??9)||String(a.name).localeCompare(String(b.name)))}
function injuryState(data){const has=data&&data.injuries&&Object.keys(data.injuries).length>0;const t=Date.parse(data?.injuriesAsOf||''),g=Date.parse(data?.generatedAt||'');const ageHours=Number.isNaN(t)||Number.isNaN(g)?null:Math.max(0,Math.round((g-t)/36e5));return {available:!!has,asOf:data?.injuriesAsOf||'',ageHours,stale:ageHours!==null&&ageHours>6}}
const dateOnly=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))?fmtDate({month:'short',day:'numeric',year:'numeric'},'UTC')(s+'T12:00:00Z'):'';
/* Team comparison from the collector's teamStats. `better` marks which direction wins; pace is neutral. */
const COMPARE_SECTIONS=[
 {title:'Scoring',rows:[['Points per game','ppg','high'],['Opponent points per game','oppPpg','low'],['Point differential','diff','high','signed']]},
 {title:'Shooting',rows:[['Field goal %','fgPct','high'],['3-point %','tpPct','high'],['Free throw %','ftPct','high'],['Opponent field goal %','oppFgPct','low'],['Opponent 3-point %','oppTpPct','low']]},
 {title:'Rebounds & ball handling',rows:[['Rebounds','reb','high'],['Offensive rebounds','oreb','high'],['Defensive rebounds','dreb','high'],['Assists','ast','high'],['Turnovers','tov','low'],['Steals','stl','high'],['Blocks','blk','high']]},
 {title:'Estimated pace & ratings',rows:[['Pace (est.)','pace',null],['Offensive rating (est.)','ortg','high'],['Defensive rating (est.)','drtg','low'],['Net rating (est.)','net','high','signed']]}];
const fmtStat=(v,signed)=>v==null?'—':(signed&&v>0?'+':'')+v;
function compareRows(a,b){return COMPARE_SECTIONS.map(sec=>({title:sec.title,rows:sec.rows.map(([label,key,better,signed])=>{const x=a?.[key]??null,y=b?.[key]??null;const cmp=x!==null&&y!==null&&x!==y&&better;return {label,a:fmtStat(x,signed),b:fmtStat(y,signed),aBetter:!!cmp&&((better==='high')===(x>y)),bBetter:!!cmp&&((better==='high')===(y>x))}})}))}
/* Box scores: current shape {teams:[{team,labels,players}]}; older snapshots stored flat per-player rows. */
function boxTeams(box){if(box&&Array.isArray(box.teams))return box.teams;if(!Array.isArray(box))return [];const groups=new Map();for(const r of box){if(!r)continue;const key=(r.team||'')+'\u0000'+(r.labels||[]).join(',');if(!groups.has(key))groups.set(key,{team:r.team||'',labels:r.labels||[],players:[]});groups.get(key).players.push({id:r.id,name:r.name,stats:r.stats||[]})}return [...groups.values()]}
function parseBoxscore(raw){const teams=[];for(const block of raw?.boxscore?.players||[]){const club=block.team?.displayName||'';for(const group of block.statistics||[]){const players=(group.athletes||[]).filter(a=>a.athlete?.id).map(a=>({id:String(a.athlete.id),name:a.athlete.displayName||'',stats:a.stats||[]}));if(players.length)teams.push({team:club,labels:group.labels||[],players})}}return teams}
/* Data notes: only failures of core data are shown prominently; everything else is a collapsed disclosure. */
const CRITICAL_NOTICE=/^(standings:|Current-season|No current-season|Upcoming fixture)|roster unavailable/i;
function splitNotices(warnings){const list=(Array.isArray(warnings)?warnings:[]).filter(w=>w!=null&&w!=='').map(String);return {critical:list.filter(w=>CRITICAL_NOTICE.test(w)),info:list.filter(w=>!CRITICAL_NOTICE.test(w))}}
/*LOGIC-END*/
const allGames=()=>state.data?.games||[];
const seasonStart=()=>state.data?.seasonStart||'0000-01-01';
const teamGames=id=>formGames(allGames(),id,seasonStart());
const regGames=id=>regularGames(allGames(),id,seasonStart());
const logo=t=>t?.logo?`<img src="${escapeHTML(t.logo)}" alt="${escapeHTML(t.name)} logo" loading="lazy">`:'';
const gameLink=g=>`https://www.espn.com/nba/game/_/gameId/${encodeURIComponent(g.id)}`;
const statusLine=g=>`${date(g.date)} · ${escapeHTML(g.away.abbr)} ${g.away.score??'–'} – ${g.home.score??'–'} ${escapeHTML(g.home.abbr)}`;
const stats=id=>state.data?.standings?.[id]||{};
const stat=(id,...keys)=>{const s=stats(id).stats||{};for(const k of keys)if(s[k]!==undefined)return s[k];return '—'};
const teamCard=id=>{const t=team(id);if(!t)return '<div class="card empty">Select a team</div>';const info=stats(id),s=info.stats||{},reg=regGames(id);const kpi=(label,official,fallback)=>`<div class="kpi"><strong>${escapeHTML(official??(fallback?fallback+'*':'—'))}</strong><span>${label}</span></div>`;const fallbackUsed=officialRecord(s)==null;return `<section class="card"><div class="team">${logo(t)}<div><strong>${escapeHTML(t.name)}</strong><div class="muted">${escapeHTML(info.conference||'Conference unavailable')} · ${escapeHTML(info.division||'Division unavailable')}</div></div></div><div class="kpis">${kpi('Conference seed',confSeed(s))}${kpi('Division rank',s.divisionRank)}${kpi('Record',officialRecord(s),record(reg,id))}${kpi('Home',splitStat(s,'Home'),record(reg.filter(g=>isHome(g,id)),id))}${kpi('Road',splitStat(s,'Road'),record(reg.filter(g=>!isHome(g,id)),id))}${kpi('Last 10',splitStat(s,'Last Ten Games'))}</div>${fallbackUsed?'<div class="small muted">* Official standings unavailable; shown from collected regular-season games.</div>':''}</section>`};
function renderLogos(){ $('logos').innerHTML=state.data.teams.map(t=>`<button class="logo ${state.team===t.id?'selected':''}" data-team="${escapeHTML(t.id)}" title="${escapeHTML(t.name)}">${logo(t)}<span>${escapeHTML(t.abbr)}</span></button>`).join('');}
function selectTeam(id){state.team=id;state.page='team';render();}
function selector(id,value){return `<select id="${id}" aria-label="${id}">${state.data.teams.map(t=>`<option value="${escapeHTML(t.id)}" ${t.id===value?'selected':''}>${escapeHTML(t.name)}</option>`).join('')}</select>`}
function form(id){const games=teamGames(id).filter(g=>state.split==='all'||((state.split==='home')===isHome(g,id))).slice(0,10);return `<div class="card"><h3>${escapeHTML(team(id)?.name||'')}</h3><div class="muted small">${games.length} completed games in selected split · W–L ${record(games,id)}</div><div class="results">${games.length?games.map(g=>`<a class="result ${won(g,id)?'win':'loss'}" target="_blank" rel="noopener" title="${escapeHTML(statusLine(g))}" href="${gameLink(g)}">${won(g,id)?'W':'L'} ${isHome(g,id)?g.home.score:g.away.score}–${isHome(g,id)?g.away.score:g.home.score}</a>`).join(''):'<span class="muted">No games available</span>'}</div><div class="small muted">Click any result for the ESPN game page. Preseason games are excluded. ${games.length<10?'Fewer than 10 games available in the selected split.':''}</div></div>`}
function h2hGames(){return h2hFrom(state.data.history,allGames(),state.home,state.away)}
function h2hPanel(games){const s=h2hSplit(games,state.home,state.away),cov=historyCoverage(state.data);const part=(k,label,always)=>s.byType[k].n||always?`${label}: ${s.byType[k].a}–${s.byType[k].b}`:'';const parts=[part('2','Regular season',true),part('3','Playoffs',cov.complete),part('5','Play-in',false)].filter(Boolean).join(' · ');const notice=cov.complete?`Covers ${escapeHTML(cov.start||'the last four seasons')} onward: four completed seasons plus the current season.`:`<strong>Partial history.</strong> ${cov.total?`${cov.have} of ${cov.total} historical days verified so far.`:'Historical results have not been collected yet.'} Earlier meetings may be missing, so totals can only increase.`;return `<section class="card center"><h2>Head to head</h2><div class="h2h">${games.length?`${cov.complete?'':'<span class="small muted">Partial · </span>'}${s.total.a} – ${s.total.b}`:'—'}</div><p class="muted small">${games.length?`${parts}${s.byType.other.n?` · Unclassified: ${s.byType.other.n} games`:''}`:'No meetings found in the verified data.'}</p><p class="${cov.complete?'muted small':'notice'}">${notice}</p></section>`}
function newsPanel(){const names=[team(state.home),team(state.away)].filter(Boolean).flatMap(t=>[t.name,t.abbr,t.name.split(' ').slice(-1)[0]]).map(x=>x.toLowerCase());const items=(state.data.news||[]).filter(a=>a.teamIds?.includes(state.home)||a.teamIds?.includes(state.away)||names.some(n=>n.length>3&&(a.title+' '+a.description).toLowerCase().includes(n))); return `<section class="card"><h2>News & storylines</h2><p class="muted small">Articles matched to either team by source tags or team names. ESPN and NBA.com feeds where available; official team sites require verified source integrations.</p>${items.length?items.slice(0,35).map(a=>`<article class="news-item"><a href="${escapeHTML(safeUrl(a.url))}" target="_blank" rel="noopener">${escapeHTML(a.title)}</a><div class="small muted">${escapeHTML(a.source)} · ${date(a.published)}</div><div class="small">${escapeHTML(a.description)}</div></article>`).join(''):'<div class="empty">No team-tagged ESPN articles returned. No stories have been invented.</div>'}</section>`}
function notesKey(){return `nba-notes:${[state.home,state.away].sort().join(":")}`}
function notesPanel(){let value={};try{value=JSON.parse(localStorage.getItem(notesKey())||'{}')}catch{}return `<section class="card"><h2>Commentator notes</h2><p class="small muted">${sharedEnabled?'Public shared notes enabled: anyone with site access can read and change them. Do not store confidential information.':'Saved in this browser. Export/import to transfer notes; configure Supabase to enable public shared notes.'}</p><div class="notes"><div><h3>${escapeHTML(team(state.home)?.name||'Home')}</h3><textarea data-note="home" placeholder="• Key talking points">${escapeHTML(value[state.home]||value.home||'')}</textarea></div><div><h3>${escapeHTML(team(state.away)?.name||'Away')}</h3><textarea data-note="away" placeholder="• Key talking points">${escapeHTML(value[state.away]||value.away||'')}</textarea></div></div><div class="toolbar">${sharedEnabled?'<button type="button" id="reload-notes">Reload shared notes</button>':''}<button type="button" id="export-notes">Export notes (JSON)</button><button type="button" id="import-notes">Import notes (JSON)</button><input type="file" id="notes-file" accept="application/json,.json" class="hide" aria-label="Import commentator notes"></div><div class="small muted" id="note-status">Autosaves as you type</div></section>`}
function comparisonPanel(){const ts=state.data.teamStats||{},a=ts[state.home],b=ts[state.away];const hs=stats(state.home).stats||{},as=stats(state.away).stats||{};const abbr=id=>escapeHTML(team(id)?.abbr||'');const row=r=>`<tr><td class="num ${r.aBetter?'best':''}">${escapeHTML(r.a)}</td><td class="center">${escapeHTML(r.label)}</td><td class="num ${r.bBetter?'best':''}">${escapeHTML(r.b)}</td></tr>`;const extra=(label,x,y)=>`<tr><td class="num">${escapeHTML(x??'—')}</td><td class="center">${label}</td><td class="num">${escapeHTML(y??'—')}</td></tr>`;if(!a&&!b)return `<section class="card"><h2>Statistical comparison</h2><div class="notice">Team statistics are unavailable in the current data refresh. Nothing has been estimated in their place.</div></section>`;return `<section class="card"><h2>Statistical comparison</h2><p class="small muted">Per-game season averages from ESPN; the better value in each row is in bold. Pace and ratings are <strong>estimates</strong> from box-score averages (possessions ≈ FGA − OREB + TO + 0.44×FTA), not official tracking data.</p><div class="table-wrap"><table><thead><tr><th class="num">${abbr(state.home)}</th><th class="center">Metric</th><th class="num">${abbr(state.away)}</th></tr></thead><tbody>${extra('Games played',a?.gp,b?.gp)}${compareRows(a,b).map(sec=>`<tr><th colspan="3" class="center">${escapeHTML(sec.title)}</th></tr>${sec.rows.map(row).join('')}`).join('')}${extra('Current streak',hs.streak,as.streak)}${extra('Last 10',splitStat(hs,'Last Ten Games'),splitStat(as,'Last Ten Games'))}</tbody></table></div></section>`}
function injuryColumn(id){const rows=teamInjuries(state.data,id);return `<div><h3>${escapeHTML(team(id)?.name||'')}</h3>${rows.length?rows.map(r=>`<article class="news-item"><strong>${escapeHTML(r.name)}</strong> <span class="muted small">${escapeHTML(r.position||'')}</span> <span class="pill ${injuryClass(r.status)}">${escapeHTML(r.status)}</span><div class="small">${escapeHTML(r.injury||'Injury details not listed')}${r.returnDate?` · estimated return ${escapeHTML(dateOnly(r.returnDate))}`:''}</div>${r.comment?`<div class="small muted">${escapeHTML(r.comment)}</div>`:''}</article>`).join(''):'<div class="empty">No injuries reported by ESPN.</div>'}</div>`}
function injuryPanel(ids){const st=injuryState(state.data);if(!st.available)return `<section class="card"><h2>Injury report</h2><div class="notice">The injury report is unavailable in the current data refresh. Check team sources before relying on availability.</div></section>`;return `<section class="card"><h2>Injury report</h2><p class="small muted">Source: ESPN · as of ${escapeHTML(dateTime(st.asOf)||'an unknown time')}. Status can change before tip-off.</p>${st.stale?`<div class="notice">This report is ${st.ageHours} hours old; the latest refresh could not update it.</div>`:''}<div class="grid">${ids.map(injuryColumn).join('')}</div></section>`}
function matchup(){const games=h2hGames();return `<div class="toolbar"><strong>Matchup</strong>${selector('home-select',state.home)}<span>vs</span>${selector('away-select',state.away)}</div><div class="grid">${teamCard(state.home)}${teamCard(state.away)}</div>${h2hPanel(games)}${injuryPanel([state.home,state.away])}<section class="card"><h2>Form & records — last 10</h2>${state.data.seasonComplete===false?'<div class="notice">Current-season collection is incomplete; form and home/away records may omit games.</div>':''}<div class="toolbar"><label for="split-select">Location</label><select id="split-select"><option value="all" ${state.split==='all'?'selected':''}>All games</option><option value="home" ${state.split==='home'?'selected':''}>Home only</option><option value="away" ${state.split==='away'?'selected':''}>Away only</option></select></div><div class="grid">${form(state.home)}${form(state.away)}</div></section>${notesPanel()}<section class="card"><h2>Previous meetings</h2>${games.length?`<div class="table-wrap"><table><thead><tr><th>Date (ET)</th><th>Type</th><th>Game</th><th>Winner</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${date(g.date)}</td><td>${escapeHTML(seasonTypeLabel(g.seasonType))}</td><td>${escapeHTML(g.away.abbr)} ${g.away.score} – ${g.home.score} ${escapeHTML(g.home.abbr)}</td><td>${escapeHTML(team(won(g,g.home.id)?g.home.id:g.away.id)?.name||'')}</td><td><a href="${gameLink(g)}" target="_blank" rel="noopener">Box score</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No previous meetings in the verified data.</div>'}</section>${comparisonPanel()}${newsPanel()}`}

function filterScheduleGames(games,teamId,status){return games.filter(g=>(teamId==='all'||g.home.id===teamId||g.away.id===teamId)&&(status==='all'||(status==='completed'?complete(g):status==='upcoming'?!complete(g):false))).sort((a,b)=>a.date.localeCompare(b.date))}
function schedule(){const games=filterScheduleGames(allGames(),state.scheduleTeam,state.scheduleStatus);const teams=state.data.teams;return `<h1>NBA Schedule & results</h1><section class="card"><div class="toolbar"><label for="schedule-team">Team</label><select id="schedule-team"><option value="all">All 30 teams</option>${teams.map(t=>`<option value="${escapeHTML(t.id)}" ${state.scheduleTeam===t.id?'selected':''}>${escapeHTML(t.name)}</option>`).join('')}</select><label for="schedule-status">Games</label><select id="schedule-status"><option value="all" ${state.scheduleStatus==='all'?'selected':''}>All</option><option value="completed" ${state.scheduleStatus==='completed'?'selected':''}>Final</option><option value="upcoming" ${state.scheduleStatus==='upcoming'?'selected':''}>Upcoming / live</option></select><span class="muted small">${games.length} games · times in ET and CET</span></div>${games.length?`<div class="table-wrap"><table><thead><tr><th>Date (ET)</th><th>Tip-off (ET · CET)</th><th>Matchup</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${date(g.date)}</td><td class="small">${escapeHTML(tipoff(g.date))}</td><td>${escapeHTML(g.away.name)} ${scoreOf(g,'away')} @ ${escapeHTML(g.home.name)} ${scoreOf(g,'home')}</td><td>${escapeHTML(seasonTypeLabel(g.seasonType))}</td><td>${escapeHTML(g.detail||g.status)}</td><td><a href="${gameLink(g)}" target="_blank" rel="noopener">Game</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No games match the selected filters.</div>'}</section>`}

function standingsPage(){const groups=standingsByConference(state.data.teams,state.data.standings);const cell=v=>escapeHTML(v==null||v===''?'—':v);return `<h1>NBA Standings</h1><p class="muted">Official ESPN standings, ordered by conference seed. Division rank is derived from win percentage and shown as tied (T) when equal. Missing fields are shown as unavailable.</p>${groups.map(({conference,rows})=>`<section class="card"><h2>${escapeHTML(conference)}</h2><div class="table-wrap"><table><thead><tr><th class="num">Seed</th><th>Team</th><th class="num">Record</th><th class="num">GB</th><th>Division</th><th class="num">Div. rank</th><th class="num">Home</th><th class="num">Road</th><th class="num">Last 10</th><th class="num">Streak</th></tr></thead><tbody>${rows.map(({team:t,info,seed})=>{const s=info.stats||{};return `<tr><td class="num">${cell(seed)}</td><td><button data-team="${escapeHTML(t.id)}">${escapeHTML(t.name)}</button></td><td class="num">${cell(officialRecord(s))}</td><td class="num">${cell(s.gamesBehind)}</td><td>${cell(info.division)}</td><td class="num">${cell(s.divisionRank)}</td><td class="num">${cell(splitStat(s,'Home'))}</td><td class="num">${cell(splitStat(s,'Road'))}</td><td class="num">${cell(splitStat(s,'Last Ten Games'))}</td><td class="num">${cell(s.streak)}</td></tr>`}).join('')}</tbody></table></div></section>`).join('')}`}
async function playerBox(gameId){if(state.details[gameId])return state.details[gameId];if(state.data?.boxscores?.[gameId])return state.details[gameId]=boxTeams(state.data.boxscores[gameId]);const url=`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${encodeURIComponent(gameId)}`;const r=await fetch(url);if(!r.ok)throw Error('Box score fetch failed');return state.details[gameId]=parseBoxscore(await r.json())}
const boxHtml=teams=>teams.length?teams.map(t=>{const cols=t.labels||[];return `<h4>${escapeHTML(t.team)}</h4><div class="table-wrap"><table><thead><tr><th>Player</th>${cols.length?cols.map(l=>`<th class="num">${escapeHTML(l)}</th>`).join(''):'<th>Game stats</th>'}</tr></thead><tbody>${t.players.map(p=>`<tr><td><a target="_blank" rel="noopener" href="https://www.espn.com/nba/player/_/id/${encodeURIComponent(p.id)}">${escapeHTML(p.name)}</a></td>${cols.length?cols.map((_,k)=>`<td class="num">${escapeHTML(p.stats?.[k]??'—')}</td>`).join(''):`<td>${escapeHTML((p.stats||[]).join(' | '))}</td>`}</tr>`).join('')}</tbody></table></div>`}).join(''):'<div class="empty">Player box score not available.</div>'
function teamPage(){const t=team(state.team);if(!t)return '<div class="empty">Select a team.</div>';const games=teamGames(t.id).slice(0,10);const players=state.data.rosters?.[t.id]||[];const season=state.data.playerSeason||{};const cols=[['gp','GP'],['min','MIN'],['pts','PTS'],['reb','REB'],['ast','AST'],['stl','STL'],['blk','BLK'],['fgPct','FG%'],['tpPct','3P%'],['ftPct','FT%']];const roster=`<section class="card"><h2>Current roster · ${escapeHTML(t.name)}</h2><p class="small muted">Per-game season averages from ESPN (${escapeHTML(state.data.season||'current season')}, regular season). A dash means the player has not played or ESPN lists no value; nothing is estimated. Click a name for the ESPN profile.</p>${players.length?`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Player</th><th>Pos</th><th>Age</th><th>Height</th>${cols.map(([,l])=>`<th class="num">${l}</th>`).join('')}</tr></thead><tbody>${players.map(p=>{const s=season[p.id]||{};return `<tr><td>${escapeHTML(p.number||'—')}</td><td><a href="https://www.espn.com/nba/player/_/id/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${escapeHTML(p.name)}</a></td><td>${escapeHTML(p.position||'—')}</td><td>${escapeHTML(p.age??'—')}</td><td>${escapeHTML(p.height||'—')}</td>${cols.map(([k])=>`<td class="num">${escapeHTML(s[k]??'—')}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`:'<div class="notice">Roster unavailable from the current data collection. No player information has been invented.</div>'}</section>`;return `<h1>${escapeHTML(t.name)}</h1>${teamCard(t.id)}${roster}${injuryPanel([t.id])}<section class="card"><h2>Recent games & player box scores</h2><p class="muted small">Choose a game to load player box scores. Recent games are cached during data refresh; older games may require ESPN access. Player names link to ESPN profiles.</p>${games.map(g=>`<div class="news-item"><button data-box="${g.id}">${escapeHTML(statusLine(g))} · View players</button><div id="box-${g.id}"></div></div>`).join('')||'<div class="empty">No completed games available.</div>'}</section>`}
function render(){if(!state.data)return;renderLogos();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('app').innerHTML=({matchup,schedule,standings:standingsPage,team:teamPage}[state.page]||matchup)();}
function renderNotices(warnings){const {critical,info}=splitNotices(warnings);$('alerts').innerHTML=(critical.length?`<div class="notice"><strong>Some core data could not be refreshed:</strong> ${critical.map(escapeHTML).join('; ')}</div>`:'')+(info.length?`<details class="data-notes"><summary>Data notes (${info.length})</summary><ul>${info.map(w=>`<li>${escapeHTML(w)}</li>`).join('')}</ul></details>`:'')}
function showError(msg){$('alerts').innerHTML=`<div class="notice">${escapeHTML(msg)}</div>`}
function exportNotes(){const items={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith('nba-notes:')){try{const value=JSON.parse(localStorage.getItem(key));if(value&&typeof value==='object'&&!Array.isArray(value))items[key]=value}catch{}}}const blob=new Blob([JSON.stringify({format:'nba-commentator-notes-v1',notes:items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='nba-commentator-notes.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validateNotesImport(raw){if(!raw||raw.format!=='nba-commentator-notes-v1'||!raw.notes||typeof raw.notes!=='object'||Array.isArray(raw.notes))throw Error('Not a valid NBA commentator notes export');const entries=Object.entries(raw.notes);if(entries.length>500)throw Error('Too many note entries');for(const [key,value] of entries){if(!/^nba-notes:[0-9]+:[0-9]+$/.test(key)||!value||typeof value!=='object'||Array.isArray(value))throw Error('Invalid matchup note');for(const [id,note] of Object.entries(value))if(!/^\d+$/.test(id)||typeof note!=='string'||note.length>100000)throw Error('Invalid note text')}return entries}
document.addEventListener('click',async e=>{if(e.target.closest('#reload-notes')){await refreshSharedNotes();return}if(e.target.closest('#export-notes')){try{exportNotes()}catch(err){$('note-status').textContent='Export failed: '+err.message}return}if(e.target.closest('#import-notes')){$('notes-file').click();return}const logoBtn=e.target.closest('[data-team]');if(logoBtn){selectTeam(logoBtn.dataset.team);return}const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();if(state.page==='matchup')refreshSharedNotes();return}const box=e.target.closest('[data-box]');if(box){const id=box.dataset.box,el=$('box-'+id);el.innerHTML='<div class="small muted">Loading players…</div>';try{el.innerHTML=boxHtml(await playerBox(id))}catch(err){el.innerHTML='<div class="notice">Could not load player statistics. ESPN may be unavailable or blocking browser requests.</div>'}}});
document.addEventListener('change',e=>{if(e.target.id==='home-select')state.home=e.target.value;if(e.target.id==='away-select')state.away=e.target.value;if(e.target.id==='split-select')state.split=e.target.value;if(e.target.id==='schedule-team')state.scheduleTeam=e.target.value;if(e.target.id==='schedule-status')state.scheduleStatus=e.target.value;if(['home-select','away-select','split-select','schedule-team','schedule-status'].includes(e.target.id)){if(state.home===state.away){state.away=state.data.teams.find(t=>t.id!==state.home)?.id||''}render();if(['home-select','away-select'].includes(e.target.id))refreshSharedNotes()}});
document.addEventListener('change',async e=>{if(e.target.id!=='notes-file')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error('File exceeds 2 MB');const entries=validateNotesImport(JSON.parse(await file.text()));if(!confirm(`Import ${entries.length} matchup note sets? Existing notes for those matchups will be overwritten.`))return;for(const [key,value] of entries)localStorage.setItem(key,JSON.stringify(value));render();$('note-status').textContent=`Imported ${entries.length} matchup note sets`}catch(err){$('note-status').textContent='Import failed: '+err.message}finally{e.target.value=''}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-note]'))return;const key=notesKey();let obj={};try{obj=JSON.parse(localStorage.getItem(key)||'{}')}catch{}obj[e.target.dataset.note==='home'?state.home:state.away]=e.target.value;try{localStorage.setItem(key,JSON.stringify(obj));$('note-status').textContent=sharedEnabled?'Saved locally · syncing…':'Saved in this browser';if(sharedEnabled){clearTimeout(notesSaveTimer);notesSaveTimer=setTimeout(async()=>{try{await saveSharedNotes(key,obj);if(key===notesKey()&&$('note-status'))$('note-status').textContent='Saved locally and shared'}catch(err){if(key===notesKey()&&$('note-status'))$('note-status').textContent='Saved locally; shared sync failed: '+err.message}},750)}}catch{$('note-status').textContent='Save failed: browser storage unavailable'}});
async function init(){try{const r=await fetch('data/nba.json?ts='+Date.now());if(!r.ok)throw Error('NBA data file missing');const d=await r.json();if(!Array.isArray(d.teams)||d.teams.length<28||!Array.isArray(d.games))throw Error('Incomplete NBA data');d.history=hydrateHistory(d.history,d.teams);state.data=d;state.home=d.teams.find(t=>t.abbr==='NY')?.id||d.teams[0].id;state.away=d.teams.find(t=>t.abbr==='MIN')?.id||d.teams[1].id;state.team=state.home;$('fresh').textContent='Updated '+dateTime(d.generatedAt);renderNotices(d.warnings);render();refreshSharedNotes()}catch(err){$('fresh').textContent='Data unavailable';showError('The NBA data pipeline has not successfully populated this site: '+err.message);$('app').innerHTML='<section class="card"><h2>Setup required</h2><p>Run <code>python scripts/update_nba.py</code> in an environment with network access, or trigger the GitHub Actions update workflow. The dashboard will not invent data when its feed is missing.</p></section>'}}
init();
</script></body></html>
