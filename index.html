'use strict';
const $=id=>document.getElementById(id);

const sharedEndpoint=()=>sharedConfig.url.replace(/\/$/,'')+'/rest/v1/nba_commentator_notes';
const sharedHeaders=()=>({'apikey':sharedConfig.anonKey,'Authorization':'Bearer '+sharedConfig.anonKey,'Content-Type':'application/json'});
let notesSaveTimer=null;
const loadLocalNotes=key=>{try{return normalizeNotes(JSON.parse(localStorage.getItem(key)||'{}'))}catch{return normalizeNotes(null)}};
const storeLocalNotes=(key,notes)=>localStorage.setItem(key,JSON.stringify(notes));
async function fetchRemoteNotes(key){const r=await fetch(sharedEndpoint()+'?matchup_key=eq.'+encodeURIComponent(key)+'&select=notes',{headers:sharedHeaders()});if(!r.ok)throw Error('Shared notes read HTTP '+r.status);const rows=await r.json();if(!Array.isArray(rows))throw Error('Invalid shared notes response');if(!rows.length)return null;const v=rows[0].notes;if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Invalid shared notes');return v}
async function loadSharedNotes(){if(!sharedEnabled)return;const key=notesKey();const remote=await fetchRemoteNotes(key);if(remote)storeLocalNotes(key,mergeNotes(loadLocalNotes(key),remote))}
/* Read-merge-write: another commentator's edits to other fields are kept; per field the later edit wins. */
async function saveSharedNotes(key){if(!sharedEnabled)return;const remote=await fetchRemoteNotes(key);const merged=mergeNotes(loadLocalNotes(key),remote);const r=await fetch(sharedEndpoint()+'?on_conflict=matchup_key',{method:'POST',headers:{...sharedHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({matchup_key:key,notes:merged})});if(!r.ok)throw Error('Shared notes write HTTP '+r.status);storeLocalNotes(key,mergeNotes(loadLocalNotes(key),merged))}
async function refreshSharedNotes(){
 if(!sharedEnabled)return;
 const key=notesKey();const status=$('note-status');if(status)status.textContent='Loading shared notes…';
 try{await loadSharedNotes();if(key===notesKey()){render();const next=$('note-status');if(next)next.textContent='Shared notes loaded · public workspace';}}
 catch(e){const next=$('note-status');if(next)next.textContent='Shared notes unavailable; local notes retained: '+e.message;}
}
const safeUrl=value=>{try{const u=new URL(String(value));return u.protocol==='https:'||u.protocol==='http:'?u.href:'#'}catch{return '#'}};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={notePlayer:'',data:null,page:'matchup',home:'',away:'',team:'',split:'all',season:'all',notes:{},details:{},error:'',scheduleTeam:'all',scheduleStatus:'all'};
const team=id=>state.data?.teams.find(t=>t.id===String(id));
/*LOGIC-START*/
const SEASON_TYPE={PRE:'1',REGULAR:'2',POST:'3',PLAYIN:'5'};
const seasonTypeLabel=t=>({'1':'Preseason','2':'Regular season','3':'Playoffs','5':'Play-in'}[String(t)]||'Unclassified');
/* Unplayed games have no score; older snapshots stored ESPN's placeholder 0. */
const scoreOf=(g,side)=>g.status==='STATUS_SCHEDULED'||g[side]?.score==null?'':g[side].score;
const complete=g=>!!g&&!!g.completed&&g.home?.score!=null&&g.away?.score!=null;
const isPreseason=g=>String(g.seasonType)===SEASON_TYPE.PRE;
const isHome=(g,id)=>g.home.id===id;
const involves=(g,id)=>g.home.id===id||g.away.id===id;
const won=(g,id)=>isHome(g,id)?g.home.score>g.away.score:g.away.score>g.home.score;
const record=(games,id)=>`${games.filter(g=>won(g,id)).length}–${games.filter(g=>!won(g,id)).length}`;
/* Merge game lists by id; later lists win, so fresh current-season rows override cached history. */
function mergeGames(...lists){const m=new Map();for(const l of lists)for(const g of Array.isArray(l)?l:[])if(g&&g.id!=null)m.set(String(g.id),g);return [...m.values()]}
/* Completed current-season games for form: regular season, play-in and playoffs; never preseason. */
function formGames(games,id,seasonStart){return games.filter(g=>complete(g)&&!isPreseason(g)&&involves(g,id)&&String(g.date||'').slice(0,10)>=seasonStart).sort((a,b)=>b.date.localeCompare(a.date))}
/* Regular-season games only: the basis of an official W-L record. */
function regularGames(games,id,seasonStart){return formGames(games,id,seasonStart).filter(g=>String(g.seasonType)===SEASON_TYPE.REGULAR)}
/* Head to head always merges stored history with the current season; an empty history must never hide current meetings. */
function h2hFrom(history,games,a,b){return a===b?[]:mergeGames(history,games).filter(g=>complete(g)&&!isPreseason(g)&&involves(g,a)&&involves(g,b)).sort((x,y)=>y.date.localeCompare(x.date))}
function h2hSplit(games,a,b){const mk=()=>({a:0,b:0,n:0});const out={total:mk(),byType:{'2':mk(),'3':mk(),'5':mk(),other:mk()}};for(const g of games){const k=['2','3','5'].includes(String(g.seasonType))?String(g.seasonType):'other';const w=won(g,a)?'a':'b';out.total[w]++;out.total.n++;out.byType[k][w]++;out.byType[k].n++}return out}
function historyCoverage(d){const have=Array.isArray(d?.historyDaysFetched)?d.historyDaysFetched.length:0;return {complete:d?.historyComplete===true,have,total:Number(d?.historyTotalDays)||0,start:d?.historyStart||''}}
/* History is stored compactly (ids + scores); restore names/abbreviations from the team list. */
function hydrateGame(g,byId){const side=s=>{const t=byId.get(String(s.id))||{};return {...s,id:String(s.id),name:s.name||t.name||'',abbr:s.abbr||t.abbr||'',logo:s.logo||t.logo||''}};return {...g,completed:g.completed??true,home:side(g.home),away:side(g.away)}}
function hydrateHistory(history,teams){const byId=new Map((teams||[]).map(t=>[String(t.id),t]));return (Array.isArray(history)?history:[]).filter(g=>g&&g.home&&g.away).map(g=>hydrateGame(g,byId))}
/* All times are displayed in US Eastern (NBA schedule) with Central European time for tip-off. */
const ET='America/New_York',CET='Europe/Budapest';
const fmtDate=(opts,tz,loc='en-US')=>s=>{const d=new Date(s);return Number.isNaN(d.valueOf())?'':new Intl.DateTimeFormat(loc,{...opts,timeZone:tz}).format(d)};
const date=fmtDate({month:'short',day:'numeric',year:'numeric'},ET);
const dateTime=fmtDate({month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'},ET);
const tipoffET=fmtDate({hour:'numeric',minute:'2-digit',timeZoneName:'short'},ET);
const tipoffCET=fmtDate({weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZoneName:'short'},CET,'en-GB');
const tipoff=s=>{const a=tipoffET(s),b=tipoffCET(s);return a&&b?`${a} · ${b}`:''};
/* Official standings fields. ESPN no longer sends an "overall" record, so derive it from wins/losses. */
const dashRecord=v=>String(v).replace(/\s*[-–]\s*/,'–');
function officialRecord(s){s=s||{};const o=s.overall||s.record;if(o)return dashRecord(o);if(s.wins!=null&&s.wins!==''&&s.losses!=null&&s.losses!=='')return `${s.wins}–${s.losses}`;return null}
/* playoffSeed is ESPN's tiebreaker-aware seed; the collector's own conferenceRank is only a fallback. */
function confSeed(s){s=s||{};return s.playoffSeed||s.conferenceRank||s.seed||null}
const splitStat=(s,key)=>{const v=(s||{})[key];return v==null||v===''?null:dashRecord(v)};
function standingsByConference(teams,standings){const groups=new Map();for(const t of teams||[]){const info=standings?.[t.id]||{};const conf=info.conference||'Unassigned';if(!groups.has(conf))groups.set(conf,[]);const raw=confSeed(info.stats),n=raw==null||raw===''?NaN:Number(raw);groups.get(conf).push({team:t,info,seed:Number.isFinite(n)?n:null})}
 return [...groups.entries()].sort(([a],[b])=>a.localeCompare(b)).map(([conference,rows])=>({conference,rows:rows.sort((x,y)=>(x.seed??999)-(y.seed??999)||x.team.name.localeCompare(y.team.name))}))}
/* Injury report: most severe first; stale or missing reports are surfaced, never hidden. */
const INJURY_ORDER={'Out':0,'Doubtful':1,'Questionable':2,'Day-To-Day':3};
const injuryClass=s=>s==='Out'?'loss':'warn';
function teamInjuries(data,teamId){return (data?.injuries?.[teamId]||[]).slice().sort((a,b)=>(INJURY_ORDER[a.status]??9)-(INJURY_ORDER[b.status]??9)||String(a.name).localeCompare(String(b.name)))}
function injuryState(data){const has=data&&data.injuries&&Object.keys(data.injuries).length>0;const t=Date.parse(data?.injuriesAsOf||''),g=Date.parse(data?.generatedAt||'');const ageHours=Number.isNaN(t)||Number.isNaN(g)?null:Math.max(0,Math.round((g-t)/36e5));return {available:!!has,asOf:data?.injuriesAsOf||'',ageHours,stale:ageHours!==null&&ageHours>6}}
const dateOnly=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))?fmtDate({month:'short',day:'numeric',year:'numeric'},'UTC')(s+'T12:00:00Z'):'';
/* Team comparison from the collector's teamStats. `better` marks which direction wins; pace is neutral. */
const COMPARE_SECTIONS=[
 {title:'Scoring',rows:[['Points per game','ppg','high'],['Opponent points per game','oppPpg','low'],['Point differential','diff','high','signed']]},
 {title:'Shooting',rows:[['Field goal %','fgPct','high'],['3-point %','tpPct','high'],['Free throw %','ftPct','high'],['Opponent field goal %','oppFgPct','low'],['Opponent 3-point %','oppTpPct','low']]},
 {title:'Rebounds & ball handling',rows:[['Rebounds','reb','high'],['Offensive rebounds','oreb','high'],['Defensive rebounds','dreb','high'],['Assists','ast','high'],['Turnovers','tov','low'],['Steals','stl','high'],['Blocks','blk','high']]},
 {title:'Estimated pace & ratings',rows:[['Pace (est.)','pace',null],['Offensive rating (est.)','ortg','high'],['Defensive rating (est.)','drtg','low'],['Net rating (est.)','net','high','signed']]}];
const fmtStat=(v,signed)=>v==null?'—':(signed&&v>0?'+':'')+v;
function compareRows(a,b){return COMPARE_SECTIONS.map(sec=>({title:sec.title,rows:sec.rows.map(([label,key,better,signed])=>{const x=a?.[key]??null,y=b?.[key]??null;const cmp=x!==null&&y!==null&&x!==y&&better;return {label,a:fmtStat(x,signed),b:fmtStat(y,signed),aBetter:!!cmp&&((better==='high')===(x>y)),bBetter:!!cmp&&((better==='high')===(y>x))}})}))}
/* Box scores: current shape {teams:[{team,labels,players}]}; older snapshots stored flat per-player rows. */
function boxTeams(box){if(box&&Array.isArray(box.teams))return box.teams;if(!Array.isArray(box))return [];const groups=new Map();for(const r of box){if(!r)continue;const key=(r.team||'')+'\u0000'+(r.labels||[]).join(',');if(!groups.has(key))groups.set(key,{team:r.team||'',labels:r.labels||[],players:[]});groups.get(key).players.push({id:r.id,name:r.name,stats:r.stats||[]})}return [...groups.values()]}
function parseBoxscore(raw){const teams=[];for(const block of raw?.boxscore?.players||[]){const club=block.team?.displayName||'';for(const group of block.statistics||[]){const players=(group.athletes||[]).filter(a=>a.athlete?.id).map(a=>({id:String(a.athlete.id),name:a.athlete.displayName||'',stats:a.stats||[]}));if(players.length)teams.push({team:club,labels:group.labels||[],players})}}return teams}
/* Data notes: only failures of core data are shown prominently; everything else is a collapsed disclosure. */
const CRITICAL_NOTICE=/^(standings:|Current-season|No current-season|Upcoming fixture)|roster unavailable/i;
function splitNotices(warnings){const list=(Array.isArray(warnings)?warnings:[]).filter(w=>w!=null&&w!=='').map(String);return {critical:list.filter(w=>CRITICAL_NOTICE.test(w)),info:list.filter(w=>!CRITICAL_NOTICE.test(w))}}
/* ---- Storylines: every line is derived from collected data; a rule that lacks its data produces nothing. ---- */
/* ESPN pads unknown injury detail with 'Not Specified'; drop it rather than print it. */
const cleanInjury=t=>String(t||'').replace(/\s*\bnot specified\b\s*/ig,' ').replace(/\s+/g,' ').trim();
const oneDec=v=>Number(v).toFixed(1);
/* '2022-10-01' -> 'the 2022–23 season' (the window starts at the first game month of a season). */
const seasonLabel=iso=>{const y=Number(String(iso||'').slice(0,4));return y?`the ${y}–${String(y+1).slice(2)} season`:'the start of the window'};
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const etDay=fmtDate({year:'numeric',month:'2-digit',day:'2-digit'},ET,'en-CA');
const dayNum=s=>Date.parse(s+'T00:00:00Z')/864e5;
const dayDiff=(a,b)=>Math.round(dayNum(b)-dayNum(a));
const streakInfo=stats=>{const m=/^([WL])(\d+)$/.exec(String(stats?.streak||''));return m?{type:m[1],n:Number(m[2])}:null};
const abbrOf=(teams,id)=>(teams||[]).find(t=>t.id===id)?.abbr||'';
const margin=(g,id)=>(isHome(g,id)?g.home.score-g.away.score:g.away.score-g.home.score);
/* Days of rest and recent load for a team before a reference instant (back-to-back = 0 days of rest). */
function restInfo(games,teamId,refIso){const ref=etDay(refIso);if(!ref)return null;const past=games.filter(g=>complete(g)&&!isPreseason(g)&&involves(g,teamId)&&etDay(g.date)<ref).sort((a,b)=>b.date.localeCompare(a.date));if(!past.length)return null;const last=etDay(past[0].date);return {restDays:dayDiff(last,ref)-1,lastDay:last,last7:past.filter(g=>dayDiff(etDay(g.date),ref)<=7).length}}
function nextMeeting(games,a,b,asOfIso){return games.filter(g=>!complete(g)&&g.status==='STATUS_SCHEDULED'&&involves(g,a)&&involves(g,b)&&g.date>=asOfIso).sort((x,y)=>x.date.localeCompare(y.date))[0]||null}
/* Rank among teams for a stat (1 = best); null unless nearly the whole league has the stat. */
function rankOf(teamStats,key,id,better){const vals=Object.entries(teamStats||{}).filter(([,v])=>v&&v[key]!=null);const mine=teamStats?.[id]?.[key];if(mine==null||vals.length<28)return null;return 1+vals.filter(([,v])=>better==='low'?v[key]<mine:v[key]>mine).length}
/* Roster players ranked by a per-game stat (players with too few games are ignored). */
function leadersBy(playerSeason,roster,key,minGp=3){return (roster||[]).map(p=>({id:p.id,name:p.name,s:playerSeason?.[p.id]})).filter(r=>r.s&&r.s.gp>=minGp&&r.s[key]!=null).sort((a,b)=>b.s[key]-a.s[key]||String(a.name).localeCompare(String(b.name)))}
function buildStorylines(c){
 const out=[];const add=(group,text)=>out.push({group,text});
 const teams=c.teams||[],games=c.games||[],h2h=c.h2h||[],A=c.home,B=c.away;if(!A||!B||A===B)return out;
 const ab=id=>abbrOf(teams,id)||'?',nm=id=>teams.find(t=>t.id===id)?.name||'?';
 const sa=c.standings?.[A]||{},sb=c.standings?.[B]||{};
 const ssn=c.seasonStart||'0000-01-01';
 // 1. Standings context
 const ctxLine=(id,s)=>{const r=officialRecord(s.stats),seed=confSeed(s.stats);return r?`${ab(id)} ${r}${seed?` (${ordinal(Number(seed))} seed, ${s.conference||'conference'})`:''}`:null};
 const la=ctxLine(A,sa),lb=ctxLine(B,sb);
 if(la&&lb)add('Matchup',`${la} vs ${lb}.`);
 if(sa.conference&&sb.conference)add('Matchup',sa.division&&sa.division===sb.division?`Division rivals (${sa.division}).`:sa.conference===sb.conference?'Conference matchup.':'Interconference matchup.');
 // 2. Season series and last meeting
 const cur=h2h.filter(g=>String(g.date).slice(0,10)>=ssn);
 if(cur.length){const wa=cur.filter(g=>won(g,A)).length,wb=cur.length-wa;add('Head to head',wa===wb?`Season series tied ${wa}–${wb}.`:`Season series: ${ab(wa>wb?A:B)} lead ${Math.max(wa,wb)}–${Math.min(wa,wb)}.`);
  const l=cur[0],wId=won(l,l.home.id)?l.home.id:l.away.id,ws=Math.max(l.home.score,l.away.score),ls=Math.min(l.home.score,l.away.score);add('Head to head',`Last meeting ${date(l.date)}: ${ab(wId)} won ${ws}–${ls} at ${ab(l.home.id)}.`)}

 const nm1=nextMeeting(games,A,B,c.asOf||'');
 if(nm1)add('Head to head',`Next meeting: ${date(nm1.date)}, ${tipoffET(nm1.date)}, ${ab(nm1.away.id)} at ${ab(nm1.home.id)}.`);

function normalizeNotes(raw){const fields={};const put=(k,t,u)=>{if(NOTE_KEY.test(k)&&typeof t==='string')fields[k]={t:t.slice(0,NOTE_MAX),u:Number.isFinite(u)?u:0}};

  else if(raw.v===undefined&&raw.fields===undefined){for(const [k,v] of Object.entries(raw))put(k,v,0)}}

/* Per field: the later edit wins; an exact tie resolves the same way on every device (larger text). */

/* Import files: v1 (flat) or v2. Returns [[matchupKey, v2 notes]]; throws on anything malformed. */
function validateNotesImport(raw){if(!raw||(raw.format!=='nba-commentator-notes-v1'&&raw.format!=='nba-commentator-notes-v2')||!raw.notes||typeof raw.notes!=='object'||Array.isArray(raw.notes))throw Error('Not a valid NBA commentator notes export');

  if(raw.format==='nba-commentator-notes-v1'){for(const [id,note] of Object.entries(value))if(!/^\d+$/.test(id)||typeof note!=='string'||note.length>100000)throw Error('Invalid note text')}

  out.push([key,normalizeNotes(value)])}

function injuryColumn(id){const rows=teamInjuries(state.data,id);return `<div><h3>${escapeHTML(team(id)?.name||'')}</h3>${rows.length?rows.map(r=>`<article class="news-item"><strong>${escapeHTML(r.name)}</strong> <span class="muted small">${escapeHTML(r.position||'')}</span> <span class="pill ${injuryClass(r.status)}">${escapeHTML(r.status)}</span><div class="small">${escapeHTML(cleanInjury(r.injury)||'Injury details not listed')}${r.returnDate?` · estimated return ${escapeHTML(dateOnly(r.returnDate))}`:''}</div>${r.comment?`<div class="small muted">${escapeHTML(r.comment)}</div>`:''}</article>`).join(''):'<div class="empty">No injuries reported by ESPN.</div>'}</div>`}
function injuryPanel(ids){const st=injuryState(state.data);if(!st.available)return `<section class="card"><h2>Injury report</h2><div class="notice">The injury report is unavailable in the current data refresh. Check team sources before relying on availability.</div></section>`;return `<section class="card"><h2>Injury report</h2><p class="small muted">Source: ESPN · as of ${escapeHTML(dateTime(st.asOf)||'an unknown time')}. Status can change before tip-off.</p>${st.stale?`<div class="notice">This report is ${st.ageHours} hours old; the latest refresh could not update it.</div>`:''}<div class="grid">${ids.map(injuryColumn).join('')}</div></section>`}
function matchup(){const games=h2hGames();return `<div class="toolbar"><strong>Matchup</strong>${selector('home-select',state.home)}<span>vs</span>${selector('away-select',state.away)}<button type="button" id="print-btn" class="hide-print" style="margin-left:auto">Print prep sheet</button></div><div class="grid">${teamCard(state.home)}${teamCard(state.away)}</div>${storylinesPanel(true)}${h2hPanel(games)}${injuryPanel([state.home,state.away])}<section class="card"><h2>Form & records — last 10</h2>${state.data.seasonComplete===false?'<div class="notice">Current-season collection is incomplete; form and home/away records may omit games.</div>':''}<div class="toolbar"><label for="split-select">Location</label><select id="split-select"><option value="all" ${state.split==='all'?'selected':''}>All games</option><option value="home" ${state.split==='home'?'selected':''}>Home only</option><option value="away" ${state.split==='away'?'selected':''}>Away only</option></select></div><div class="grid">${form(state.home)}${form(state.away)}</div></section>${notesPanel()}<section class="card"><h2>Previous meetings</h2>${games.length?`<div class="table-wrap"><table><thead><tr><th>Date (ET)</th><th>Type</th><th>Game</th><th>Winner</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${date(g.date)}</td><td>${escapeHTML(seasonTypeLabel(g.seasonType))}</td><td>${escapeHTML(g.away.abbr)} ${g.away.score} – ${g.home.score} ${escapeHTML(g.home.abbr)}</td><td>${escapeHTML(team(won(g,g.home.id)?g.home.id:g.away.id)?.name||'')}</td><td><a href="${gameLink(g)}" target="_blank" rel="noopener">Box score</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No previous meetings in the verified data.</div>'}</section>${comparisonPanel()}${newsPanel()}`}

function filterScheduleGames(games,teamId,status){return games.filter(g=>(teamId==='all'||g.home.id===teamId||g.away.id===teamId)&&(status==='all'||(status==='completed'?complete(g):status==='upcoming'?!complete(g):false))).sort((a,b)=>a.date.localeCompare(b.date))}
function schedule(){const games=filterScheduleGames(allGames(),state.scheduleTeam,state.scheduleStatus);const teams=state.data.teams;return `<h1>NBA Schedule & results</h1><section class="card"><div class="toolbar"><label for="schedule-team">Team</label><select id="schedule-team"><option value="all">All 30 teams</option>${teams.map(t=>`<option value="${escapeHTML(t.id)}" ${state.scheduleTeam===t.id?'selected':''}>${escapeHTML(t.name)}</option>`).join('')}</select><label for="schedule-status">Games</label><select id="schedule-status"><option value="all" ${state.scheduleStatus==='all'?'selected':''}>All</option><option value="completed" ${state.scheduleStatus==='completed'?'selected':''}>Final</option><option value="upcoming" ${state.scheduleStatus==='upcoming'?'selected':''}>Upcoming / live</option></select><span class="muted small">${games.length} games · times in ET and CET</span></div>${games.length?`<div class="table-wrap"><table><thead><tr><th>Date (ET)</th><th>Tip-off (ET · CET)</th><th>Matchup</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${date(g.date)}</td><td class="small">${escapeHTML(tipoff(g.date))}</td><td>${escapeHTML(g.away.name)} ${scoreOf(g,'away')} @ ${escapeHTML(g.home.name)} ${scoreOf(g,'home')}</td><td>${escapeHTML(seasonTypeLabel(g.seasonType))}</td><td>${escapeHTML(g.detail||g.status)}</td><td><a href="${gameLink(g)}" target="_blank" rel="noopener">Game</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No games match the selected filters.</div>'}</section>`}

function standingsPage(){const groups=standingsByConference(state.data.teams,state.data.standings);const cell=v=>escapeHTML(v==null||v===''?'—':v);return `<h1>NBA Standings</h1><p class="muted">Official ESPN standings, ordered by conference seed. Division rank is derived from win percentage and shown as tied (T) when equal. Missing fields are shown as unavailable.</p>${groups.map(({conference,rows})=>`<section class="card"><h2>${escapeHTML(conference)}</h2><div class="table-wrap"><table><thead><tr><th class="num">Seed</th><th>Team</th><th class="num">Record</th><th class="num">GB</th><th>Division</th><th class="num">Div. rank</th><th class="num">Home</th><th class="num">Road</th><th class="num">Last 10</th><th class="num">Streak</th></tr></thead><tbody>${rows.map(({team:t,info,seed})=>{const s=info.stats||{};return `<tr><td class="num">${cell(seed)}</td><td><button data-team="${escapeHTML(t.id)}">${escapeHTML(t.name)}</button></td><td class="num">${cell(officialRecord(s))}</td><td class="num">${cell(s.gamesBehind)}</td><td>${cell(info.division)}</td><td class="num">${cell(s.divisionRank)}</td><td class="num">${cell(splitStat(s,'Home'))}</td><td class="num">${cell(splitStat(s,'Road'))}</td><td class="num">${cell(splitStat(s,'Last Ten Games'))}</td><td class="num">${cell(s.streak)}</td></tr>`}).join('')}</tbody></table></div></section>`).join('')}`}
async function playerBox(gameId){if(state.details[gameId])return state.details[gameId];if(state.data?.boxscores?.[gameId])return state.details[gameId]=boxTeams(state.data.boxscores[gameId]);const url=`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${encodeURIComponent(gameId)}`;const r=await fetch(url);if(!r.ok)throw Error('Box score fetch failed');return state.details[gameId]=parseBoxscore(await r.json())}
const boxHtml=teams=>teams.length?teams.map(t=>{const cols=t.labels||[];return `<h4>${escapeHTML(t.team)}</h4><div class="table-wrap"><table><thead><tr><th>Player</th>${cols.length?cols.map(l=>`<th class="num">${escapeHTML(l)}</th>`).join(''):'<th>Game stats</th>'}</tr></thead><tbody>${t.players.map(p=>`<tr><td><a target="_blank" rel="noopener" href="https://www.espn.com/nba/player/_/id/${encodeURIComponent(p.id)}">${escapeHTML(p.name)}</a></td>${cols.length?cols.map((_,k)=>`<td class="num">${escapeHTML(p.stats?.[k]??'—')}</td>`).join(''):`<td>${escapeHTML((p.stats||[]).join(' | '))}</td>`}</tr>`).join('')}</tbody></table></div>`}).join(''):'<div class="empty">Player box score not available.</div>'
function teamPage(){const t=team(state.team);if(!t)return '<div class="empty">Select a team.</div>';const games=teamGames(t.id).slice(0,10);const players=state.data.rosters?.[t.id]||[];const season=state.data.playerSeason||{};const cols=[['gp','GP'],['min','MIN'],['pts','PTS'],['reb','REB'],['ast','AST'],['stl','STL'],['blk','BLK'],['fgPct','FG%'],['tpPct','3P%'],['ftPct','FT%']];const roster=`<section class="card"><h2>Current roster · ${escapeHTML(t.name)}</h2><p class="small muted">Per-game season averages from ESPN (${escapeHTML(state.data.season||'current season')}, regular season). A dash means the player has not played or ESPN lists no value; nothing is estimated. Click a name for the ESPN profile.</p>${players.length?`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Player</th><th>Pos</th><th>Age</th><th>Height</th>${cols.map(([,l])=>`<th class="num">${l}</th>`).join('')}</tr></thead><tbody>${players.map(p=>{const s=season[p.id]||{};return `<tr><td>${escapeHTML(p.number||'—')}</td><td><a href="https://www.espn.com/nba/player/_/id/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${escapeHTML(p.name)}</a></td><td>${escapeHTML(p.position||'—')}</td><td>${escapeHTML(p.age??'—')}</td><td>${escapeHTML(p.height||'—')}</td>${cols.map(([k])=>`<td class="num">${escapeHTML(s[k]??'—')}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`:'<div class="notice">Roster unavailable from the current data collection. No player information has been invented.</div>'}</section>`;return `<h1>${escapeHTML(t.name)}</h1>${teamCard(t.id)}${roster}${injuryPanel([t.id])}<section class="card"><h2>Recent games & player box scores</h2><p class="muted small">Choose a game to load player box scores. Recent games are cached during data refresh; older games may require ESPN access. Player names link to ESPN profiles.</p>${games.map(g=>`<div class="news-item"><button data-box="${g.id}">${escapeHTML(statusLine(g))} · View players</button><div id="box-${g.id}"></div></div>`).join('')||'<div class="empty">No completed games available.</div>'}</section>`}
function render(){if(!state.data)return;renderLogos();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('app').innerHTML=({matchup,schedule,standings:standingsPage,team:teamPage}[state.page]||matchup)();}
function renderNotices(warnings){const {critical,info}=splitNotices(warnings);$('alerts').innerHTML=(critical.length?`<div class="notice"><strong>Some core data could not be refreshed:</strong> ${critical.map(escapeHTML).join('; ')}</div>`:'')+(info.length?`<details class="data-notes"><summary>Data notes (${info.length})</summary><ul>${info.map(w=>`<li>${escapeHTML(w)}</li>`).join('')}</ul></details>`:'')}
function showError(msg){$('alerts').innerHTML=`<div class="notice">${escapeHTML(msg)}</div>`}
function exportNotes(){const items={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&NOTES_KEY.test(key)){try{const value=normalizeNotes(JSON.parse(localStorage.getItem(key)));if(nonEmptyNotes(value).length)items[key]=value}catch{}}}const blob=new Blob([JSON.stringify({format:'nba-commentator-notes-v2',notes:items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='nba-commentator-notes.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',async e=>{const add=e.target.closest('[data-note-add]');if(add){appendToMatchupNote('• '+add.dataset.noteAdd);return}const pl=e.target.closest('[data-note-player]');if(pl){state.notePlayer=pl.dataset.notePlayer;render();return}if(e.target.closest('#print-btn')){renderPrintSheet();window.print();return}if(e.target.closest('#reload-notes')){await refreshSharedNotes();return}if(e.target.closest('#export-notes')){try{exportNotes()}catch(err){$('note-status').textContent='Export failed: '+err.message}return}if(e.target.closest('#import-notes')){$('notes-file').click();return}const logoBtn=e.target.closest('[data-team]');if(logoBtn){selectTeam(logoBtn.dataset.team);return}const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();if(state.page==='matchup')refreshSharedNotes();return}const box=e.target.closest('[data-box]');if(box){const id=box.dataset.box,el=$('box-'+id);el.innerHTML='<div class="small muted">Loading players…</div>';try{el.innerHTML=boxHtml(await playerBox(id))}catch(err){el.innerHTML='<div class="notice">Could not load player statistics. ESPN may be unavailable or blocking browser requests.</div>'}}});
document.addEventListener('change',e=>{if(e.target.id==='home-select')state.home=e.target.value;if(e.target.id==='away-select')state.away=e.target.value;if(e.target.id==='split-select')state.split=e.target.value;if(e.target.id==='schedule-team')state.scheduleTeam=e.target.value;if(e.target.id==='schedule-status')state.scheduleStatus=e.target.value;if(['home-select','away-select','split-select','schedule-team','schedule-status'].includes(e.target.id)){if(state.home===state.away){state.away=state.data.teams.find(t=>t.id!==state.home)?.id||''}render();if(['home-select','away-select'].includes(e.target.id))refreshSharedNotes()}});
document.addEventListener('change',async e=>{if(e.target.id!=='notes-file')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error('File exceeds 2 MB');const entries=validateNotesImport(JSON.parse(await file.text()));if(!confirm(`Merge ${entries.length} matchup note sets into this browser? Per field, the later edit wins; nothing is deleted.`))return;for(const [key,value] of entries)storeLocalNotes(key,mergeNotes(loadLocalNotes(key),value));render();$('note-status').textContent=`Merged ${entries.length} matchup note sets`}catch(err){$('note-status').textContent='Import failed: '+err.message}finally{e.target.value=''}});
document.addEventListener('change',e=>{if(e.target.id==='note-player'){state.notePlayer=e.target.value;render();return}if(e.target.id==='note-template'){const t=NOTE_TEMPLATES.find(x=>x.id===e.target.value);e.target.value='';if(t)appendToMatchupNote(t.text)}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-note]'))return;const key=notesKey(),k=e.target.dataset.note,n=setNote(loadLocalNotes(key),k,e.target.value,Date.now());persistNotes(key,n);const st=document.querySelector('[data-stamp="'+k+'"]');if(st)st.textContent=stampText(n,k);if(k.startsWith('p:'))refreshPlayerNoteMarkers()});
async function init(){try{const r=await fetch('data/nba.json?ts='+Date.now());if(!r.ok)throw Error('NBA data file missing');const d=await r.json();if(!Array.isArray(d.teams)||d.teams.length<28||!Array.isArray(d.games))throw Error('Incomplete NBA data');d.history=hydrateHistory(d.history,d.teams);state.data=d;state.home=d.teams.find(t=>t.abbr==='NY')?.id||d.teams[0].id;state.away=d.teams.find(t=>t.abbr==='MIN')?.id||d.teams[1].id;state.team=state.home;$('fresh').textContent='Updated '+dateTime(d.generatedAt);renderNotices(d.warnings);render();refreshSharedNotes()}catch(err){$('fresh').textContent='Data unavailable';showError('The NBA data pipeline has not successfully populated this site: '+err.message);$('app').innerHTML='<section class="card"><h2>Setup required</h2><p>Run <code>python scripts/update_nba.py</code> in an environment with network access, or trigger the GitHub Actions update workflow. The dashboard will not invent data when its feed is missing.</p></section>'}}
init();
</script></body></html>
